[project]
name = "horn-design"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "build123d>=0.13.0",
    "ezdxf>=1.4.5",
    "ipykernel>=7.1.0",
    "marimo>=0.26",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.5",
    "ocp-vscode>=4.3.0",
    "ruff>=0.14.10",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bope_claude_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ocp-viewer>=1.3.0",
    "pytest>=9.2.0",
]
